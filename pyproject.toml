[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-browser"
version = "0.3.0"
description = "Universal AI browser service — accessible to all AI agents"
requires-python = ">=3.10"
dependencies = [
    "nodriver>=0.50",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "mss>=10.0",
    "pillow>=10.0",
    "requests>=2.28",
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
ai-browser = "src.main:main"
ai-browser-server = "src.server:main"
ai-browser-mcp = "src.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
