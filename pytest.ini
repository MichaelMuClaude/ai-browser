[pytest]
asyncio_mode = auto
markers =
    smoke: Core regression tests that must pass reliably (default)
    anti_bot: Anti-bot related tests, may be run separately and allowed to flake
    native: Tests requiring X11/native engine, skipped if environment unavailable
    benchmark: Latency benchmarks against real URLs, run manually before ship (not in default suite)
testpaths = tests
addopts = -ra -q
